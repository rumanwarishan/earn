<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Billions Earn">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3ecbff"/>
      <stop offset="1" stop-color="#9b6bff"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd873"/>
      <stop offset="1" stop-color="#e8b923"/>
    </linearGradient>
    <linearGradient id="earInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc9ec"/>
      <stop offset="1" stop-color="#ff9fd6"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- ears -->
  <ellipse cx="22.5" cy="15" rx="5.4" ry="13.5" fill="#f5f7ff" transform="rotate(-16 22.5 15)"/>
  <ellipse cx="22.5" cy="16" rx="2.6" ry="9.5" fill="url(#earInner)" transform="rotate(-16 22.5 16)"/>
  <ellipse cx="41.5" cy="15" rx="5.4" ry="13.5" fill="#f5f7ff" transform="rotate(16 41.5 15)"/>
  <ellipse cx="41.5" cy="16" rx="2.6" ry="9.5" fill="url(#earInner)" transform="rotate(16 41.5 16)"/>

  <!-- head -->
  <circle cx="32" cy="35" r="15.5" fill="#f5f7ff"/>

  <!-- face -->
  <circle cx="26.2" cy="33" r="2.1" fill="#0a0a0f"/>
  <circle cx="37.8" cy="33" r="2.1" fill="#0a0a0f"/>
  <ellipse cx="32" cy="38" rx="1.7" ry="1.3" fill="#ff9fd6"/>
  <path d="M27 42c2 1.6 8 1.6 10 0" stroke="#0a0a0f" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <ellipse cx="21.5" cy="38.5" rx="2.6" ry="1.6" fill="#ffc9ec" opacity="0.7"/>
  <ellipse cx="42.5" cy="38.5" rx="2.6" ry="1.6" fill="#ffc9ec" opacity="0.7"/>

  <!-- coin held in paws -->
  <circle cx="32" cy="49" r="8.4" fill="url(#coin)" stroke="#a5720f" stroke-width="1"/>
  <text x="32" y="53" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="700" font-size="10" fill="#7a5406">$</text>

  <!-- paws -->
  <ellipse cx="22.5" cy="49.5" rx="4.6" ry="5.6" fill="#f5f7ff"/>
  <ellipse cx="41.5" cy="49.5" rx="4.6" ry="5.6" fill="#f5f7ff"/>
</svg>
