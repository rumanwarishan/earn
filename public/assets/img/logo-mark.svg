<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Billions Earn">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c383"/>
      <stop offset="1" stop-color="#d99c4f"/>
    </linearGradient>
    <linearGradient id="cheek" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3da"/>
      <stop offset="1" stop-color="#ffe3ae"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe19a"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb066" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffb066" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb066"/>
      <stop offset="0.5" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff6bd6"/>
    </linearGradient>
    <filter id="neonBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#glow)"/>

  <!-- ears -->
  <circle cx="15" cy="17" r="6.2" fill="url(#fur)"/>
  <circle cx="15" cy="17" r="3.2" fill="#c2793a"/>
  <circle cx="49" cy="17" r="6.2" fill="url(#fur)"/>
  <circle cx="49" cy="17" r="3.2" fill="#c2793a"/>

  <!-- head -->
  <circle cx="32" cy="30" r="20" fill="url(#fur)"/>
  <circle cx="32" cy="30" r="20" fill="none" stroke="url(#neon)" stroke-width="1.6" filter="url(#neonBlur)" opacity="0.85"/>

  <!-- big hamster cheeks -->
  <ellipse cx="14.5" cy="35" rx="9.5" ry="8.5" fill="url(#cheek)"/>
  <ellipse cx="49.5" cy="35" rx="9.5" ry="8.5" fill="url(#cheek)"/>

  <!-- whisker dots -->
  <circle cx="10" cy="32" r="0.9" fill="#a5622a"/>
  <circle cx="8.5" cy="35.5" r="0.9" fill="#a5622a"/>
  <circle cx="10" cy="39" r="0.9" fill="#a5622a"/>
  <circle cx="54" cy="32" r="0.9" fill="#a5622a"/>
  <circle cx="55.5" cy="35.5" r="0.9" fill="#a5622a"/>
  <circle cx="54" cy="39" r="0.9" fill="#a5622a"/>

  <!-- eyes, happy -->
  <circle cx="24" cy="25" r="2.9" fill="#241505"/>
  <circle cx="25" cy="23.8" r="1" fill="#fff" opacity="0.9"/>
  <circle cx="40" cy="25" r="2.9" fill="#241505"/>
  <circle cx="41" cy="23.8" r="1" fill="#fff" opacity="0.9"/>

  <!-- nose -->
  <ellipse cx="32" cy="31.5" rx="2.6" ry="2" fill="#3a2410"/>

  <!-- smiling mouth -->
  <path d="M26 35c2.5 3 9.5 3 12 0" stroke="#7a4a1a" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <!-- paws holding coin -->
  <ellipse cx="21" cy="49" rx="5" ry="4" fill="url(#fur)"/>
  <ellipse cx="43" cy="49" rx="5" ry="4" fill="url(#fur)"/>

  <!-- coin -->
  <circle cx="32" cy="49" r="12.5" fill="url(#coin)" stroke="#a5620f" stroke-width="1.1"/>
  <circle cx="32" cy="49" r="12.5" fill="none" stroke="url(#neon)" stroke-width="1.2" filter="url(#neonBlur)" opacity="0.8"/>
  <text x="32" y="54.5" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="800" font-size="15" fill="#7a3f06">B</text>
</svg>
