<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Billions Earn">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c383"/>
      <stop offset="1" stop-color="#d99c4f"/>
    </linearGradient>
    <linearGradient id="cheek" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3da"/>
      <stop offset="1" stop-color="#ffe3ae"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb066" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffb066" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb066"/>
      <stop offset="0.5" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff6bd6"/>
    </linearGradient>
    <filter id="neonBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#glow)"/>

  <!-- ears -->
  <circle cx="16" cy="15" r="7" fill="url(#fur)"/>
  <circle cx="16" cy="15" r="3.6" fill="#c2793a"/>
  <circle cx="48" cy="15" r="7" fill="url(#fur)"/>
  <circle cx="48" cy="15" r="3.6" fill="#c2793a"/>

  <!-- head: bigger and centered now that the coin is gone, so the beaver
       itself fills the badge instead of being cropped by held paws -->
  <circle cx="32" cy="35" r="25" fill="url(#fur)"/>
  <circle cx="32" cy="35" r="25" fill="none" stroke="url(#neon)" stroke-width="1.8" filter="url(#neonBlur)" opacity="0.85"/>

  <!-- big cheeks -->
  <ellipse cx="9.5" cy="39" rx="10.5" ry="9.5" fill="url(#cheek)"/>
  <ellipse cx="54.5" cy="39" rx="10.5" ry="9.5" fill="url(#cheek)"/>

  <!-- whisker dots -->
  <circle cx="4.5" cy="36" r="1" fill="#a5622a"/>
  <circle cx="3" cy="40" r="1" fill="#a5622a"/>
  <circle cx="4.5" cy="44" r="1" fill="#a5622a"/>
  <circle cx="59.5" cy="36" r="1" fill="#a5622a"/>
  <circle cx="61" cy="40" r="1" fill="#a5622a"/>
  <circle cx="59.5" cy="44" r="1" fill="#a5622a"/>

  <!-- eyes, happy -->
  <circle cx="23" cy="29" r="3.2" fill="#241505"/>
  <circle cx="24.1" cy="27.7" r="1.1" fill="#fff" opacity="0.9"/>
  <circle cx="41" cy="29" r="3.2" fill="#241505"/>
  <circle cx="42.1" cy="27.7" r="1.1" fill="#fff" opacity="0.9"/>

  <!-- nose -->
  <ellipse cx="32" cy="36" rx="3" ry="2.3" fill="#3a2410"/>

  <!-- open smiling mouth -->
  <path d="M22 40c3 6 8 8.5 10 8.5s7-2.5 10-8.5" stroke="#7a4a1a" stroke-width="1.6" fill="#4a2a10" fill-opacity="0.12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- signature big front teeth, now the badge's own focal detail -->
  <rect x="27.6" y="40" width="4" height="6.5" rx="1.2" fill="#fffaf0" stroke="#c9a86a" stroke-width="0.6"/>
  <rect x="32" y="40" width="4" height="6.5" rx="1.2" fill="#fffaf0" stroke="#c9a86a" stroke-width="0.6"/>
</svg>
