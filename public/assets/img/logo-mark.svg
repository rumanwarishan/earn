<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Billions Earn">
  <defs>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe19a"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <linearGradient id="earInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc9ec"/>
      <stop offset="1" stop-color="#ff9fd6"/>
    </linearGradient>
    <linearGradient id="furShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4e6f7"/>
    </linearGradient>
  </defs>

  <!-- transparent background: mascot sits directly on the page's ambient glow -->

  <!-- ears (behind head) -->
  <ellipse cx="17" cy="13" rx="7" ry="17.5" fill="url(#furShade)" transform="rotate(-14 17 13)"/>
  <ellipse cx="17" cy="14" rx="3.3" ry="12" fill="url(#earInner)" transform="rotate(-14 17 14)"/>
  <ellipse cx="37" cy="11.5" rx="7" ry="17.5" fill="url(#furShade)" transform="rotate(11 37 11.5)"/>
  <ellipse cx="37" cy="12.5" rx="3.3" ry="12" fill="url(#earInner)" transform="rotate(11 37 12.5)"/>

  <!-- head - big, dominant -->
  <circle cx="28" cy="37" r="22" fill="url(#furShade)"/>

  <!-- face -->
  <circle cx="20.5" cy="34" r="2.7" fill="#12121f"/>
  <circle cx="34.5" cy="34" r="2.7" fill="#12121f"/>
  <ellipse cx="27.5" cy="40.5" rx="2.1" ry="1.6" fill="#ff9fd6"/>
  <path d="M21.5 45.5c3 2.4 10.5 2.4 13.5 0" stroke="#12121f" stroke-width="1.7" stroke-linecap="round" fill="none"/>
  <ellipse cx="13.5" cy="42" rx="3.4" ry="2.1" fill="#ffc9ec" opacity="0.75"/>
  <ellipse cx="42.5" cy="42" rx="3.4" ry="2.1" fill="#ffc9ec" opacity="0.75"/>

  <!-- left paw, resting -->
  <ellipse cx="14" cy="55" rx="6.6" ry="7.6" fill="url(#furShade)"/>

  <!-- raised right arm (drawn over the head edge) reaching up to hold the coin aloft -->
  <path d="M43 52c9-1 14-9 13.5-21" stroke="url(#furShade)" stroke-width="8.5" stroke-linecap="round" fill="none"/>
  <circle cx="56.5" cy="29" r="6.6" fill="url(#furShade)"/>

  <!-- coin, held aloft above the raised paw -->
  <circle cx="53" cy="13" r="11" fill="url(#coin)" stroke="#a5620f" stroke-width="1.1"/>
  <text x="53" y="18.3" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="800" font-size="13" fill="#7a3f06">$</text>
</svg>
