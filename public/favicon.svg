<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Billions Earn">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9873f"/>
      <stop offset="1" stop-color="#8a5723"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e2b8"/>
      <stop offset="1" stop-color="#e4c58c"/>
    </linearGradient>
    <linearGradient id="teeth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f2e6cc"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe19a"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf8a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ambient glow -->
  <circle cx="32" cy="31" r="29" fill="url(#glow)"/>

  <!-- ears -->
  <circle cx="13.5" cy="18" r="7.5" fill="url(#fur)"/>
  <circle cx="13.5" cy="18" r="4" fill="url(#belly)"/>
  <circle cx="46.5" cy="16" r="7.5" fill="url(#fur)"/>
  <circle cx="46.5" cy="16" r="4" fill="url(#belly)"/>

  <!-- head -->
  <circle cx="31" cy="34" r="21" fill="url(#fur)"/>

  <!-- cheek / belly patch -->
  <ellipse cx="31" cy="41" rx="14.5" ry="11.5" fill="url(#belly)"/>

  <!-- eyes -->
  <circle cx="22.5" cy="28" r="2.7" fill="#241505"/>
  <circle cx="23.4" cy="27" r="0.9" fill="#fff" opacity="0.85"/>
  <circle cx="39.5" cy="28" r="2.7" fill="#241505"/>
  <circle cx="40.4" cy="27" r="0.9" fill="#fff" opacity="0.85"/>

  <!-- nose -->
  <ellipse cx="31" cy="35" rx="3.6" ry="2.8" fill="#3a2410"/>

  <!-- coin, gripped at the mouth - most of the coin (and the B) stays clear below the teeth -->
  <circle cx="32" cy="50" r="14" fill="url(#coin)" stroke="#a5620f" stroke-width="1.1"/>
  <text x="32" y="57" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="800" font-size="18" fill="#7a3f06">B</text>

  <!-- buck teeth, biting the top edge of the coin -->
  <rect x="24.5" y="38" width="6.6" height="9" rx="2.4" fill="url(#teeth)" stroke="#d8c093" stroke-width="0.6"/>
  <rect x="32.4" y="38" width="6.6" height="9" rx="2.4" fill="url(#teeth)" stroke="#d8c093" stroke-width="0.6"/>
  <path d="M31.7 38.5v8" stroke="#d8c093" stroke-width="0.6"/>
</svg>
