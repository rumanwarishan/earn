<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Billions Earn">
  <defs>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe19a"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f5fb"/>
      <stop offset="1" stop-color="#cfd3ea"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf8a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ambient glow behind the coin -->
  <circle cx="33" cy="23" r="28" fill="url(#glow)"/>

  <!-- open palm, cupped upward -->
  <path d="M13 48c0-8.5 9-14 20-14s20 5.5 20 14-9 14-20 14-20-5.5-20-14z" fill="url(#skin)"/>

  <!-- fingertips peeking up behind the coin -->
  <circle cx="19" cy="33" r="6" fill="url(#skin)"/>
  <circle cx="27" cy="30" r="6.5" fill="url(#skin)"/>
  <circle cx="39" cy="30" r="6.5" fill="url(#skin)"/>
  <circle cx="47" cy="33" r="6" fill="url(#skin)"/>

  <!-- thumb, resting beside the coin -->
  <circle cx="11" cy="43" r="7.5" fill="url(#skin)"/>

  <!-- coin held in the palm, on top -->
  <circle cx="33" cy="23" r="16" fill="url(#coin)" stroke="#a5620f" stroke-width="1.2"/>
  <text x="33" y="29.5" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-weight="800" font-size="19" fill="#7a3f06">$</text>
</svg>
